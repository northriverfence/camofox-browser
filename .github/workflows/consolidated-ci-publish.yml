# CI, issue handling, nightly upstream mirroring and release publishing.
# Dedicated telemetry deployment retains its original path-only trigger.
name: Consolidated CI and Publishing
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  issues:
    types: [opened]
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual action'
        type: choice
        options: [docker, clawhub, mirror]
        required: true
      version:
        description: 'Docker image version; required for manual Docker publish'
        type: string
        required: false
permissions:
  contents: read
jobs:
  unit:
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Run unit + plugin tests (Jest)
        run: |
          npm install --no-save jest-junit
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test' \
            --forceExit
        env:
          CI: true

  e2e:
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run e2e + browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Run browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  check-version:
    if: ${{ (github.event_name == 'issues') && (contains(join(github.event.issue.labels.*.name, ','), 'auto-report')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check reporter version
        uses: actions/github-script@v7
        with:
          script: |
            const MIN_VERSION = [1, 7, 4];
            const body = context.payload.issue.body || '';

            // Parse "- **version:** X.Y.Z" from issue body
            const match = body.match(/\*\*[Vv]ersion:\*\*\s*v?(\d+\.\d+\.\d+)/);
            if (!match) {
              console.log('No version found in issue body, closing.');
            } else {
              const parts = match[1].split('.').map(Number);
              let dominated = false;
              for (let i = 0; i < MIN_VERSION.length; i++) {
                if ((parts[i] || 0) > MIN_VERSION[i]) { dominated = false; break; }
                if ((parts[i] || 0) < MIN_VERSION[i]) { dominated = true; break; }
              }
              if (!dominated) {
                console.log(`Version ${match[1]} meets minimum ${MIN_VERSION.join('.')}.`);

                const labels = context.payload.issue.labels.map(l => l.name);

                // Auto-close likely-sleep issues (CPU ratio near zero = OS suspend, not real stall)
                if (labels.includes('likely-sleep')) {
                  console.log('likely-sleep label detected, closing.');
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: 'Closing — classified as OS sleep/suspend (CPU/wall ratio near zero).',
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    state: 'closed',
                    state_reason: 'not_planned',
                  });
                  return;
                }

                // Auto-close stalls with no active tabs (no user work affected)
                if (labels.includes('stuck')) {
                  const tabMatch = body.match(/\*\*active tabs:\*\*\s*(\d+)/);
                  if (tabMatch && parseInt(tabMatch[1], 10) === 0) {
                    console.log('Stall with 0 active tabs, closing.');
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: 'Closing — event loop stall with no active tabs (no user work affected). If you hit this during active browsing, please re-open.',
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                    });
                    return;
                  }
                }

                // Auto-close memory leaks with 0 sessions + 0 tabs (self-healing restart handles these)
                if (labels.includes('memory-leak')) {
                  const ctxMatch = body.match(/\*\*browser contexts:\*\*\s*(\d+)/);
                  const tabMatch = body.match(/\*\*active tabs:\*\*\s*(\d+)/);
                  if (ctxMatch && tabMatch &&
                      parseInt(ctxMatch[1], 10) === 0 && parseInt(tabMatch[1], 10) === 0) {
                    console.log('Memory leak with 0 contexts + 0 tabs, closing (self-healing).');
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: 'Closing — native memory growth detected with no active sessions. The memory pressure restart mechanism automatically reclaims this when idle. This is expected Firefox/Playwright behavior (jemalloc fragmentation, CDP buffers). If you experience OOM crashes during active use, please re-open.',
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                    });
                    return;
                  }
                }

                console.log('Keeping open.');
                return;
              }
              console.log(`Version ${match[1]} below minimum ${MIN_VERSION.join('.')}, closing.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Closing — reported from v${match ? match[1] : 'unknown'}, minimum supported is v${MIN_VERSION.join('.')}. Please upgrade to get improved crash diagnostics.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

  dry-run:
    permissions:
      contents: read
      id-token: write
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'clawhub')) && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      dry_run: true

  clawhub-publish:
    permissions:
      contents: read
      id-token: write
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'clawhub')) && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  docker:
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    if: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'docker')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jo-inc/camofox-browser:${{ env.VERSION }}
            ghcr.io/jo-inc/camofox-browser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror:
    permissions:
      contents: write
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'mirror')) }}
    name: Mirror latest Camoufox browser release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: daijro/camoufox
    steps:
      - name: Fetch and verify latest upstream release metadata
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" > upstream-release.json

          source_id=$(jq -er '.id | tostring' upstream-release.json)
          source_tag=$(jq -er '.tag_name' upstream-release.json)
          source_url=$(jq -er '.html_url' upstream-release.json)
          mirror_tag="camoufox-backup-${source_id}"
          asset_count=$(jq '[.assets[] | select(.name | test("^camoufox-[A-Za-z0-9._-]+\\.zip$"))] | length' upstream-release.json)
          total_bytes=$(jq '[.assets[] | select(.name | test("^camoufox-[A-Za-z0-9._-]+\\.zip$")) | .size] | add // 0' upstream-release.json)

          if [[ "$asset_count" -eq 0 ]]; then
            echo "No Camoufox zip assets found in upstream release ${source_tag}." >&2
            exit 1
          fi

          # Keep a malformed upstream release from exhausting the hosted runner.
          if [[ "$total_bytes" -gt $((10 * 1024 * 1024 * 1024)) ]]; then
            echo "Upstream assets total ${total_bytes} bytes, above the 10 GiB safety limit." >&2
            exit 1
          fi

          echo "source_id=${source_id}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${source_tag}" >> "$GITHUB_OUTPUT"
          echo "source_url=${source_url}" >> "$GITHUB_OUTPUT"
          echo "mirror_tag=${mirror_tag}" >> "$GITHUB_OUTPUT"
          echo "asset_count=${asset_count}" >> "$GITHUB_OUTPUT"
          echo "total_bytes=${total_bytes}" >> "$GITHUB_OUTPUT"

      - name: Skip an already mirrored release
        id: existing
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${{ steps.upstream.outputs.mirror_tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Camoufox release ${{ steps.upstream.outputs.source_tag }} is already mirrored."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download browser archives and create checksums
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          assets_dir=camoufox-assets
          mkdir -p "$assets_dir"

          while IFS=$'\t' read -r name url expected_size; do
            if [[ ! "$name" =~ ^camoufox-[A-Za-z0-9._-]+\.zip$ ]]; then
              echo "Unsafe or unexpected upstream asset name: $name" >&2
              exit 1
            fi

            echo "Downloading $name"
            curl --fail --location --retry 3 --retry-all-errors \
              --proto '=https' --proto-redir '=https' \
              --output "$assets_dir/$name" "$url"

            actual_size=$(wc -c < "$assets_dir/$name" | tr -d '[:space:]')
            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "Downloaded size mismatch for $name: expected $expected_size, got $actual_size." >&2
              exit 1
            fi
          done < <(jq -r '.assets[] | select(.name | test("^camoufox-[A-Za-z0-9._-]+\\.zip$")) | [.name, .browser_download_url, .size] | @tsv' upstream-release.json)

          (
            cd "$assets_dir"
            sha256sum ./*.zip > SHA256SUMS
          )

          jq \
            --arg source_repository "$UPSTREAM_REPOSITORY" \
            --arg mirrored_at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mirror_tag "${{ steps.upstream.outputs.mirror_tag }}" \
            '{
              sourceRepository: $source_repository,
              sourceRelease: {
                id: .id,
                tag: .tag_name,
                name: .name,
                url: .html_url,
                publishedAt: .published_at
              },
              mirrorReleaseTag: $mirror_tag,
              mirroredAt: $mirrored_at,
              assets: [
                .assets[]
                | select(.name | test("^camoufox-[A-Za-z0-9._-]+\\.zip$"))
                | {name, size, sourceUrl: .browser_download_url}
              ]
            }' upstream-release.json > "$assets_dir/manifest.json"

          cat > release-notes.md <<EOF
          Backup of [${{ steps.upstream.outputs.source_tag }}](${{ steps.upstream.outputs.source_url }}) from \`${UPSTREAM_REPOSITORY}\`.

          This is an availability backup. Verify the archive against \`SHA256SUMS\` before use.

          - Mirrored archives: ${{ steps.upstream.outputs.asset_count }}
          - Total source size: ${{ steps.upstream.outputs.total_bytes }} bytes
          EOF

      - name: Publish backup release
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.upstream.outputs.mirror_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Camoufox backup ${{ steps.upstream.outputs.source_tag }}" \
            --notes-file release-notes.md \
            camoufox-assets/*

  test:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Unit + plugin tests (Jest)
        run: |
          npm install --no-save jest-junit
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test' \
            --forceExit
        env:
          CI: true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: E2E tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  publish:
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          MCP_VERSION=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ] || [ "$TAG_VERSION" != "$MCP_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION), root package version ($ROOT_VERSION), and MCP package version ($MCP_VERSION) must match"
            exit 1
          fi
          echo "✅ Publishing both packages at v${TAG_VERSION}"

      - run: npm ci --ignore-scripts

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Publish core package with provenance
        run: npm publish --provenance --access public

      - name: Publish standalone MCP package with provenance
        working-directory: mcp
        run: npm publish --provenance --access public
